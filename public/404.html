<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Palette</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/palette/assets/palette-icon.png" />
    <script>
      const segmentCount = 1
      const l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          '&_cb=' +
          Date.now() +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
